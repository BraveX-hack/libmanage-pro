<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31104b" />
      <stop offset="100%" stop-color="#180728" />
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.6)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.15)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Book background -->
  <rect width="600" height="800" fill="url(#bg)" />
  <rect width="600" height="800" fill="url(#grid)" />

  <!-- Book Spine 3D Effect -->
  <rect x="0" y="0" width="35" height="800" fill="url(#spine)" />
  <line x1="35" y1="0" x2="35" y2="800" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <line x1="37" y1="0" x2="37" y2="800" stroke="rgba(0,0,0,0.4)" stroke-width="1.5" />

  <!-- Decorative Borders -->
  <rect x="55" y="35" width="510" height="730" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" rx="6" />
  <rect x="65" y="45" width="490" height="710" fill="none" stroke="#c084fc" stroke-opacity="0.35" stroke-width="1" rx="4" />

  <!-- ESGIS University Badge -->
  <rect x="75" y="65" width="210" height="28" rx="4" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <circle cx="90" cy="79" r="6" fill="#c084fc" />
  <text x="104" y="83" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" letter-spacing="1.5">ESGIS BIBLIOTHÈQUE</text>

  <!-- Category Tag -->
  <rect x="75" y="110" width="150" height="22" rx="11" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-width="1" />
  <text x="150" y="125" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#c084fc" text-anchor="middle" letter-spacing="1">INFORMATIQUE & IA</text>

  <!-- Title & Subtitle -->
  <text x="75" y="240" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="32" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
    INTELLIGENCE ARTIFICIELLE
  </text>
  <text x="75" y="285" font-family="Georgia, Cambria, 'Times New Roman', serif" font-size="20" font-weight="normal" fill="#c084fc" font-style="italic">
    Deep Learning & Fondements
  </text>

  <line x1="75" y1="320" x2="240" y2="320" stroke="#c084fc" stroke-width="3" stroke-linecap="round" />

  <!-- Author -->
  <text x="75" y="370" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="rgba(255,255,255,0.6)" letter-spacing="2">AUTEUR(S)</text>
  <text x="75" y="402" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#f1f5f9">Stuart Russell & Peter Norvig</text>

  <!-- Center Decorative Academic Emblem -->
  <g transform="translate(300, 520)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <circle cx="0" cy="0" r="45" fill="none" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1" />
    <!-- Book icon path -->
    <path d="M -24 -10 Q 0 -18 24 -10 L 24 16 Q 0 8 -24 16 Z" fill="none" stroke="#c084fc" stroke-width="2.5" />
    <line x1="0" y1="-15" x2="0" y2="11" stroke="#c084fc" stroke-width="2.5" />
  </g>

  <!-- Bottom Info Panel -->
  <rect x="75" y="640" width="470" height="85" rx="6" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <text x="95" y="668" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.5)">ÉDITEUR UNIVERSITAIRE</text>
  <text x="95" y="692" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Dunod Sciences (2024)</text>

  <text x="410" y="668" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="rgba(255,255,255,0.5)">LOCALISATION</text>
  <text x="410" y="692" font-family="'Courier New', Courier, monospace" font-size="15" font-weight="bold" fill="#c084fc">INF-A01</text>

  <!-- Barcode simulation -->
  <g transform="translate(95, 705)">
    <rect x="0" y="0" width="2" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="4" y="0" width="3" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="9" y="0" width="1" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="12" y="0" width="4" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="18" y="0" width="2" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="23" y="0" width="3" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="28" y="0" width="1" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="31" y="0" width="2" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="35" y="0" width="3" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="40" y="0" width="1" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="43" y="0" width="4" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="49" y="0" width="2" height="12" fill="rgba(255,255,255,0.4)" />
    <rect x="53" y="0" width="3" height="12" fill="rgba(255,255,255,0.4)" />
  </g>
</svg>